# Third-party actions are pinned by commit; this keeps those pins moving.
# agentic-job is referenced by release tag, which this moves too; our other
# own actions (cgwalters-forge/actions) follow main and need no updates.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite actions' own pins.
    directories: [/, /tailscale, /lint]
    schedule:
      interval: daily
    # policy, check and apply must name the same tag (the run refuses calls
    # at differing commits), so a new tag is one pull request for all three,
    # in both cgwalters-agentic-job.yml and cgwalters-review.yml.
    groups:
      agentic-job:
        patterns: ["cgwalters-forge/agentic-job*"]
    # A release that turns out to be compromised is usually pulled within
    # days; checking daily but taking only week-old versions avoids pinning
    # one in the meantime. agentic-job is our own and was followed at main
    # until its first release, so it is not held back.
    cooldown:
      default-days: 7
      exclude: ["cgwalters-forge/agentic-job*"]
  # secure-host/Containerfile.pin, the image the action runs: Dependabot
  # moves its tag and digest together. The image is agentic-job's release,
  # our own, so it is not held back either.
  - package-ecosystem: docker
    directory: /secure-host
    schedule:
      interval: daily
